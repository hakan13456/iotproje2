# RSMB (Really Small Message Broker) config for MQTT-SN gateway
# Runs on A8 Linux side (border router node)

# MQTT-SN UDP port
listener 1883 INADDR_ANY mqtts
  ipv6 true

# Optional: MQTT TCP port (for debugging with mosquitto_pub)
listener 1886 INADDR_ANY
  ipv6 true

# Logging
trace_output file /tmp/rsmb.log
